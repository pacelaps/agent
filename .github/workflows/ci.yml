name: CI

on:
  push:
  pull_request:

# Builds and tests only: the token can read, nothing more (pull requests come from anyone once the repository is public).
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      # The operator's package (one self-contained exe), checked with --version, so a packaging break shows at once.
      - name: Package
        shell: pwsh
        run: ./scripts/publish.ps1

      # The upload to downloads.pacelaps.com: the bucket helpers, and a dry run on the package just built.
      - name: Downloads script
        shell: pwsh
        run: |
          ./scripts/downloads-lib.tests.ps1
          $zip = Get-ChildItem artifacts -Filter 'pacelaps-agent-*-win-x64.zip' | Select-Object -First 1
          $version = $zip.Name -replace '^pacelaps-agent-(.+)-win-x64\.zip$', '$1'
          ./scripts/upload-downloads.ps1 -Version $version -DryRun

      - uses: actions/upload-artifact@v4
        with:
          name: pacelaps-agent-dev
          path: |
            artifacts/*.zip
            artifacts/*.zip.sha256
          retention-days: 7
