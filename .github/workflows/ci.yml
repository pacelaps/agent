name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      # The operator's package (one self-contained exe), checked with --version, so a packaging break shows at once.
      - name: Package
        shell: pwsh
        run: ./scripts/publish.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: pacelaps-agent-dev
          path: |
            artifacts/*.zip
            artifacts/*.zip.sha256
          retention-days: 7
